project:
  name: coop3d-system
  version: 0.1.0

dataset:
  name: opv2v
  root: data/opv2v
  split: validate
  max_time_offset_ms: 100

model:
  detector: pointpillars
  checkpoint: null
  score_threshold: 0.3

fusion:
  mode: late
  matching_method: center_distance
  matching_threshold_m: 2.0

communication:
  latency_ms: 0
  jitter_ms: 0
  packet_loss: 0.0
  bandwidth_mbps: null
  disconnected: false

pose_noise:
  translation_std_m: 0.0
  rotation_std_deg: 0.0

runtime:
  device: cpu
  seed: 42
  output_dir: outputs/demo

visualization:
  enabled: true
  show_bev: true
  save_result: true
